[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-f1-rag"
version = "0.1.0"
description = "A Streamlit RAG benchmark for Formula 1 knowledge sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "streamlit>=1.57",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "safetensors>=0.4.3"]
faiss = ["faiss-cpu>=1.8"]
chroma = ["chromadb>=0.5"]
benchmark = ["psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]
